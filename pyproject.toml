[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "specguard"
version = "0.1.0"
description = "Verify that AI-generated work actually follows the instructions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "SpecGuard contributors" }]
keywords = ["ai", "llm", "compliance", "audit", "instructions", "docx", "markdown", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "regex>=2024.11",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-regex",
]

[project.scripts]
specguard = "specguard.cli:main"

[project.urls]
Homepage = "https://github.com/seun-john/specguard"
Issues = "https://github.com/seun-john/specguard/issues"
Changelog = "https://github.com/seun-john/specguard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/specguard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "specguard.example.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["specguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # curly quotes and dashes are the subject matter here

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501", "PT018"]  # long parametrised literals; compound asserts read fine
"examples/**" = ["E501"]
"src/specguard/cli.py" = ["B008"]  # Typer declares options as default arguments
"src/specguard/extractors/instructions.py" = ["E501"]  # long regular expressions

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/specguard", "tests"]
plugins = ["pydantic.mypy"]
mypy_path = "src:."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true
